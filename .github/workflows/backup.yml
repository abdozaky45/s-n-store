name: Daily MongoDB Backup to S3 (Tokyo)

on:
  schedule:
    # Runs every day at 02:37 UTC (~04:37 Cairo). The minute is deliberately off
    # the top of the hour — GitHub delays (and sometimes drops) cron runs most at
    # :00 under load. Scheduled runs only fire from the default branch (main).
    - cron: '37 2 * * *'
  workflow_dispatch: {}   # manual "Run workflow" button for testing

# Never let two backup runs overlap.
concurrency:
  group: mongo-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Dump MongoDB and upload to S3
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      MDB_TOOLS_VERSION: '100.12.1'
      BACKUP_BUCKET: snlingeri-db-backups
      BACKUP_REGION: ap-northeast-1
      S3_PREFIX: mongo

    steps:
    - name: Install MongoDB Database Tools
      run: |
        TARBALL="mongodb-database-tools-ubuntu2204-x86_64-${MDB_TOOLS_VERSION}"
        curl -fsSL "https://fastdl.mongodb.org/tools/db/${TARBALL}.tgz" -o tools.tgz
        tar -xzf tools.tgz
        echo "${PWD}/${TARBALL}/bin" >> "$GITHUB_PATH"

    - name: Verify mongodump
      run: mongodump --version

    - name: Create compressed dump
      run: |
        STAMP=$(date -u +%Y-%m-%d_%H%M%S)
        ARCHIVE="backup-${STAMP}.gz"
        mongodump --uri="${{ secrets.DB_URL }}" --gzip --archive="${ARCHIVE}"
        SIZE=$(du -h "${ARCHIVE}" | cut -f1)
        echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"
        echo "### Dump created: \`${ARCHIVE}\` (${SIZE})" >> "$GITHUB_STEP_SUMMARY"

    - name: Configure AWS credentials (backup user)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.BACKUP_AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.BACKUP_AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.BACKUP_REGION }}

    - name: Upload to S3 (Tokyo)
      run: |
        aws s3 cp "${ARCHIVE}" "s3://${BACKUP_BUCKET}/${S3_PREFIX}/${ARCHIVE}"
        echo "### Uploaded to s3://${BACKUP_BUCKET}/${S3_PREFIX}/${ARCHIVE}" >> "$GITHUB_STEP_SUMMARY"
